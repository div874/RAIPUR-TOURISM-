<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Contribute to Hamara — Share Stories, Food Spots & Events</title>
  <meta name="description" content="Contribute your local stories, hidden food recommendations, photos, and events to Hamara Raipur. Join our community of local contributors.">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link href="css/animate.css" rel="stylesheet">
  <link href="css/font-awesome.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link href="css/raipurtales.css?v=14" rel="stylesheet">
</head>
<body>

<!-- HEADER / NAVIGATION -->
<header class="header">
  <div class="container position-relative">
    <nav class="custom-navbar">
      <a class="navbar-brand-tab" href="index.html">
        <img src="images/logo.png" alt="Hamara Raipur" class="rt-logo-img">
      </a>

      <button class="menu-icon" type="button" aria-label="Menu">
        <span style="display:block;width:24px;height:2px;background:#003838;margin:5px 0;"></span>
        <span style="display:block;width:24px;height:2px;background:#003838;margin:5px 0;"></span>
        <span style="display:block;width:24px;height:2px;background:#003838;margin:5px 0;"></span>
      </button>

      <div class="collapse-menu">
        <div class="close-rt-pnl"><i data-lucide="x"></i></div>
        <ul class="navbar-menu">
          <li class="nav-item"><a class="nav-link" href="eat.html">EAT</a></li>
          <li class="nav-item"><a class="nav-link" href="events.html">EVENTS</a></li>
          <li class="nav-item"><a class="nav-link" href="experiences.html">EXPERIENCES</a></li>
          <li class="nav-item"><a class="nav-link" href="stories.html">STORIES</a></li>
          <li class="nav-item"><a class="nav-link" href="plan-your-visit.html">PLAN</a></li>
        </ul>
      </div>

      <a href="explore.html" class="btn-rt-header d-none d-md-inline-flex">
        EXPLORE RAIPUR <i data-lucide="arrow-right"></i>
      </a>
    </nav>
  </div>
</header>

<!-- PAGE HERO HEADER -->
<section class="rt-section" style="padding-top: 140px; background-color: var(--rt-offwhite); border-bottom: 1px solid var(--rt-border);">
  <div class="container">
    <div class="rt-section-header m-0 text-left">
      <span class="rt-label">COMMUNITY SUBMISSION</span>
      <h1 class="rt-title">CONTRIBUTE TO HAMARA</h1>
      <p class="rt-subtitle">Share your local food recommendations, hidden places, events, and neighborhood stories.</p>
    </div>
  </div>
</section>

<!-- CONTRIBUTE FORM -->
<section class="rt-section" style="background-color: var(--rt-offwhite);">
  <div class="container" style="max-width: 760px;">
    <div class="rt-ai-box">
      <form action="#" method="post">
        <div class="mb-4">
          <label class="form-label font-weight-bold" style="color: var(--rt-teal);">Contribution Type</label>
          <select class="rt-ai-input w-100">
            <option>Share a Local Story</option>
            <option>Recommend a Food Spot</option>
            <option>List an Upcoming Event</option>
            <option>Suggest a Place to Discover</option>
          </select>
        </div>

        <div class="mb-4">
          <label class="form-label font-weight-bold" style="color: var(--rt-teal);">Your Name</label>
          <input type="text" class="rt-ai-input w-100" placeholder="e.g., Ananya Verma">
        </div>

        <div class="mb-4">
          <label class="form-label font-weight-bold" style="color: var(--rt-teal);">Email Address</label>
          <input type="email" class="rt-ai-input w-100" placeholder="e.g., ananya@example.com">
        </div>

        <div class="mb-4">
          <label class="form-label font-weight-bold" style="color: var(--rt-teal);">Title / Headline</label>
          <input type="text" class="rt-ai-input w-100" placeholder="e.g., Best Farra stall near Gole Bazaar main arch">
        </div>

        <div class="mb-4">
          <label class="form-label font-weight-bold" style="color: var(--rt-teal);">Description & Details</label>
          <textarea class="rt-ai-input w-100" rows="5" placeholder="Share your experience, opening hours, story or event details..."></textarea>
        </div>

        <button type="submit" class="btn-rt-primary w-100" style="padding: 14px 28px;">Submit Contribution <i data-lucide="send"></i></button>
      </form>
    </div>
  </div>
</section>

<!-- FOOTER -->
<footer class="footer">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center flex-wrap" style="font-size: 12px; color: rgba(255,255,255,0.7);">
      <p class="m-0">© 2026 Hamara Raipur Platform. All Rights Reserved.</p>
      <div>
        <a href="index.html" style="color: rgba(255,255,255,0.7); text-decoration: none; margin-left: 14px;">Home</a>
        <a href="about.html" style="color: rgba(255,255,255,0.7); text-decoration: none; margin-left: 14px;">About</a>
      </div>
    </div>
  </div>
</footer>

<script src="js/jquery-3.6.4.min.js"></script>
<script src="js/bootstrap.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="js/raipurtales.js"></script>
<script>if (typeof lucide !== 'undefined') { lucide.createIcons(); }</script>
</body>
</html>
