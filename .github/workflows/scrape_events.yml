name: Scheduled Raipur Event Ingestion Pipeline

on:
  schedule:
    # Run every 3 hours automatically in GitHub Cloud (24/7 even when PC is turned off)
    - cron: '0 */3 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 lxml

      - name: Run Event Ingestion Pipeline
        run: |
          python scrape_events.py

      - name: Commit and Push Updated events.json
        run: |
          git config --global user.name "RaipurTales Automation Bot"
          git config --global user.email "bot@raipurtales.com"
          git add events.json
          git status
          git diff-index --quiet HEAD || (git commit -m "Auto-update live events dataset [skip ci]" && git push origin master)
